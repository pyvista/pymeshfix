[build-system]
build-backend = "scikit_build_core.build"
requires = ["scikit-build-core >=1.0", "nanobind >=3.1"]

[project]
authors = [
  { name = "PyVista Developers", email = "info@pyvista.org" }
]
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Free Threading :: 2 - Beta"
]
dependencies = [
  "nanobind-backend >=1,<2",
  "numpy"
]
description = "Repair triangular meshes using MeshFix"
name = "pymeshfix"
readme = "README.rst"
requires-python = ">=3.10,<3.16"
version = "0.19.dev0"

[project.optional-dependencies]
docs = [
  "Sphinx",
  "pydata-sphinx-theme",
  "pyvista",
  "sphinx_gallery",
  "sphinx-notfound-page>=0.3.0",
  "sphinx-copybutton"
]
extras = [
  "pyvista"
]
tests = [
  "pyvista",
  "pytest",
  "pytest-cov"
]

[project.urls]
'Bug Reports' = 'https://github.com/pyvista/pymeshfix/issues'
Documentation = 'https://pymeshfix.pyvista.org/'
Homepage = 'https://github.com/pyvista/pymeshfix'
'Source Code' = 'https://github.com/pyvista/pymeshfix'

[tool.cibuildwheel]
archs = ["auto64"]  # 64-bit only
build = "cp310-* cp315t-*"  # abi3 wheel for 3.10+, abi3t wheel for free-threaded 3.15+
skip = "*musllinux*"
test-command = "pytest {project}/tests -vv"
test-requires = "pytest pyvista meshio pymeshfix"
# vtk has no cp315t wheels for these platforms
test-skip = "cp315t-macosx_arm64 cp315t-win_*"

[tool.cibuildwheel.macos]
archs = ["native"]
environment = { MACOSX_DEPLOYMENT_TARGET = "10.13" }

[tool.codespell]
quiet-level = 3
skip = '*.cxx,*.h,*.gif,*.png,*.jpg,*.js,*.html,*.doctree,*.ttf,*.woff,*.woff2,*.eot,*.mp4,*.inv,*.pickle,*.ipynb,flycheck*,./.git/*,./.hypothesis/*,*.yml,./doc/build/*,./doc/images/*,./dist/*,*~,.hypothesis*,*.cpp,*.c'

[tool.pytest.ini_options]
junit_family = "legacy"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pyflakes, pycodestyle, isort
select = ["F", "E", "W", "I001"]

[tool.scikit-build]
wheel.py-api = "cp310"

# Not the combined "cp310.cp315t": nanobind's free-threaded build can't load on GIL Pythons
[[tool.scikit-build.overrides]]
if.abi-flags = "t"
wheel.py-api = "cp315t"
